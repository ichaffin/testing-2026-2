name: 🐛 Reporte de Incidente
description: Reportá un bug, mejora o sugerencia encontrada durante el testing
title: "[ISSUE] "
labels: ["incidente"]
body:
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de Issue
      description: ¿Qué tipo de issue estás reportando?
      options:
        - BUG
        - MEJORA
        - SUGERENCIA
    validations:
      required: true

  - type: dropdown
    id: grupo
    attributes:
      label: Grupo
      description: ¿A qué grupo pertenecés?
      options:
        - Grupo 1
        - Grupo 2
        - TP ESI
    validations:
      required: true

  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      description: ¿Qué tan grave es el incidente?
      options:
        - Crítica (bloquea el uso de la app)
        - Alta (funcionalidad principal afectada)
        - Media (funcionalidad secundaria afectada)
        - Baja (cosmético / detalle menor)
    validations:
      required: true

  - type: dropdown
    id: criticidad
    attributes:
      label: Criticidad
      description: Impacto o urgencia del problema en el negocio / usuarios
      options:
        - ALTA
        - MEDIA
        - BAJA
    validations:
      required: true

  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      description: Navegador, sistema operativo, versión, dispositivo, etc.
      placeholder: "Ej: Chrome 128 / Windows 11 / Desktop"
    validations:
      required: true

  - type: checkboxes
    id: precondiciones
    attributes:
      label: Precondiciones
      description: Marcá todas las que apliquen antes de reproducir el incidente
      options:
        - label: Usuario logueado
        - label: Usuario no logueado
        - label: Rol admin
        - label: Datos de prueba cargados
        - label: Acceso a internet
        - label: Ninguna
        - label: Otra (especificar abajo)

  - type: input
    id: precondiciones_otra
    attributes:
      label: Otra precondición (si corresponde)
      description: Completá solo si tildaste "Otra" arriba
      placeholder: "Ej: Conexión a internet activa"
    validations:
      required: false

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      description: Detallá paso a paso cómo llegar al incidente
      placeholder: |
        1. Ir a...
        2. Hacer click en...
        3. Completar el campo...
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
      description: ¿Qué debería pasar?
    validations:
      required: true

  - type: textarea
    id: obtenido
    attributes:
      label: Resultado obtenido
      description: ¿Qué pasó realmente?
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Screenshots, videos o logs. Podés arrastrar archivos directo acá.
    validations:
      required: false
